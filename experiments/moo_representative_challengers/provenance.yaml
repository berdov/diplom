        toy_experiments/solvers/ferero.py: 5ed098fac5c657c7601747cae641700a77da3c9807d7582e78eda78632b62c86
        toy_experiments/solvers/min_norm_solvers_numpy.py: 7ba1699ed0133985126549f1a6bd9cecf8ec8c34767570ecf63828dbbc28aa6c
      deviations:
      - Official simplex-dual PGD equality subproblem, generalized from two to five
        tasks with the same normalized inverse-preference loss ray. Zero residual
        fixes relative loss ratios; no task-performance threshold is introduced. The
        paper classifies homogeneous ray equalities under its absolute-preference
        formalism, not a cone-only relative order.
      - Spectral step cap min(0.1,0.9/L) for numerical stability; agrees with official
        toy solver when cap is inactive. No fallback to weighted sum.
      - Shared-backbone Gram (as EPO benchmark); coefficients backpropagate through
        all task heads. Frozen Adam replaces toy outer SGD.
