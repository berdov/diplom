        SARCOS/trainer.py: 5bcf62c3c36fdfa7fdfc55441b3f40b9cc78670ad50b7fe3f00bac00abcdeb5f
      deviations:
      - Same 5→64→128 zero-initialized FiLM hypernetwork as historical PHN-adapter,
        rather than generating all TiM4Rec parameters; full-network version is technically
        feasible but adds about 65x generator parameter overhead. See DESIGN.md.
      - HVI acts on minibatch-mean normalized task losses, matching the official Jura
        trainer aggregation (Multi_MNIST additionally provides per-example HVI). Frozen
        Adam/learning rate replaces Jura optimizer schedule.
      - Eight preferences and cosine coefficient 0.001 frozen from official Jura defaults;
        independent Dirichlet alpha=0.2 for five objectives. Existing six-point evaluation
        grid.
      - Independent inclusion-exclusion geometry matches official multifront normalized
        HV gradients, duplicate handling and adaptive reference. Use official negative
        cosine sign (paper equation 8 / code; printed equation 5 has conflicting sign).
      - Two-pass RNG replay reduces peak activation memory; same gradient as joint
        multi-sample backward. Preference input cloned to avoid mutable-buffer autograd
        aliasing.
      - No extra 30-epoch cosine-only Jura warmup; joint HVI+cosine begins at batch
        one inside the shared screening budget. This is an explicit method adaptation.
      - Existing preference vectors denote objective importance. The hypernetwork
        receives these same vectors; cosine alignment uses the normalized inverse-priority
        loss ray, as in EPO/FERERO loss-ray semantics. The official Jura trainer uses
        its sampled vector directly as a loss ray. This reparameterization and induced
        ray distribution are declared adaptations, frozen before data training.
