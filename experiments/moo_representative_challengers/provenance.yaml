        zdt_moo.py: a6b5e0ed8592e5813fd9ea9041b0e6a3b7b980f090461aef941a9a3e09e6ff13
      deviations:
      - Five existing normalized objectives replace federated clients; minibatch gradients
        replace local client parameter deltas; frozen Adam outer optimizer; three
        independent TiM4Rec models.
      - No warmup in centralized minibatch training; fixed set_obj_stepsize=1, no
        decay, no gradient rescaling beyond train diagnostic losses.
      - Official IPOT, adjusted marginals, conditional MGDA, masking, linearized cost
        and EMA are retained. The pinned Frank-Wolfe solver returns after its first
        iteration; this behavior is deliberately preserved, not silently repaired.
      - In the MGDA branch official coefficients combine raw gradients after solving
        on transport-weighted gradients; this convention is preserved. CPU-safe one-active-objective
        case avoids upstream unconditional .cuda().
