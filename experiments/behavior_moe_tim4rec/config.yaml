run_id: behavior_moe_smoke_001

base:
  model: BehaviorMoETiM4Rec
  base_model: MultitaskTiM4Rec
  backbone: TiM4Rec
  protocol: KuaiRand Protocol B multitask
  optuna_config: experiments/multitask_tim4rec_optuna/config.yaml
  best_params: experiments/multitask_tim4rec_optuna/best_params.yaml
  tuned_checkpoint: /home/daryumin/iberdov/diplom/experiments/multitask_tim4rec_optuna/multitask_tim4rec_tuned_001/checkpoints/best_validation.pth
  base_reference_run: tim4rec_001
  fixed_multitask_reference_run: multitask_tim4rec_001
  tuned_fixed_reference_run: multitask_tim4rec_tuned_001

smoke:
  run_id: behavior_moe_smoke_001
  batches: 5
  split: train
  full_epochs: 0
  full_validation: false
  full_training: false
  routing_mode: generic

structured_smoke:
  run_id: structured_behavior_moe_smoke_001
  batches: 5
  split: train
  full_epochs: 0
  full_validation: false
  full_training: false
  routing_mode: structured
  compare_with: behavior_moe_smoke_001

ple_smoke:
  run_id: ple_tim4rec_smoke_001
  batches: 5
  split: train
  full_epochs: 0
  full_validation: false
  full_training: false
  variant: ple
  compare_with:
    - behavior_moe_smoke_001
    - structured_behavior_moe_smoke_001

sanity:
  run_id: behavior_moe_sanity_001
  epochs: 5
  split: validation
  evaluation: full_7111_items
  training_data: full_train
  train_subset: false
  early_stopping: false
  full_training_after_sanity: false
  optuna: false
  test:
    load_dataset: false
    create_dataloader: false
    evaluate: false
    evaluation_count: 0
  routing_diagnostic:
    split: validation
    fixed_order: true
    batches: 5
    examples: 8

architecture:
  behavior_moe:
    routing_mode: generic
    experts:
      - interest
      - consumption
      - positive
      - shared
    expert_dropout: 0.08565706719893162
    router_temperature: 1.0
    router_semantic_bias: 0.05
    residual_scale: 0.1
    load_balance_weight: 0.0
  structured_behavior_moe:
    routing_mode: structured
    experts:
      - interest
      - consumption
      - engagement
      - shared
    expert_dropout: 0.08565706719893162
    router_temperature: 1.0
    router_semantic_bias: 0.05
    residual_scale: 0.1
    load_balance_weight: 0.0
    allowed_experts:
      rank:
        - interest
        - consumption
        - engagement
        - shared
      is_click:
        - interest
        - shared
      long_view:
        - consumption
        - shared
      is_like:
        - engagement
        - shared
      is_profile_enter:
        - engagement
        - shared
  ple_tim4rec:
    canonical_name: CGC-1level PLE-style baseline
    model_name: PLETiM4Rec
    extraction_levels: 1
    shared_experts: 2
    specific_experts_per_task: 1
    expert_hidden_size: 37
    expert_dropout: 0.08565706719893162
    router_temperature: 1.0
    load_balance_weight: 0.0
    residual: false
    task_specific_experts:
      rank: ranking_specific
      is_click: click_specific
      long_view: long_view_specific
      is_like: like_specific
      is_profile_enter: profile_specific
    shared_expert_names:
      - shared_0
      - shared_1
    gate_input: shared TiM4Rec representation h
    task_gate_access:
      rank:
        - ranking_specific
        - shared_0
        - shared_1
      is_click:
        - click_specific
        - shared_0
        - shared_1
      long_view:
        - long_view_specific
        - shared_0
        - shared_1
      is_like:
        - like_specific
        - shared_0
        - shared_1
      is_profile_enter:
        - profile_specific
        - shared_0
        - shared_1
  load_balance:
    prepared: true
    enabled: false
    coefficient: 0.0
    formula: "mean((mean_task_batch_p_expert - 1 / num_experts) ** 2)"

targets:
  ranking: rank
  auxiliary:
    - is_click
    - long_view
    - is_like
    - is_profile_enter

experts:
  interest: is_click
  consumption: long_view
  positive: is_like + is_profile_enter
  shared: residual/general expert

structured_experts:
  interest: is_click
  consumption: long_view
  engagement: is_like + is_profile_enter
  shared: residual/general expert

ple_experts:
  ranking_specific: rank
  click_specific: is_click
  long_view_specific: long_view
  like_specific: is_like
  profile_specific: is_profile_enter
  shared_0: shared task-common expert
  shared_1: shared task-common expert

ple_sanity:
  run_id: ple_tim4rec_sanity_001
  epochs: 5
  split: validation
  evaluation: full_7111_items
  training_data: full_train
  train_subset: false
  early_stopping: false
  full_training_after_sanity: false
  optuna: false
  test:
    load_dataset: false
    create_dataloader: false
    evaluate: false
    evaluation_count: 0
  routing_diagnostic:
    split: validation
    fixed_order: true
    batches: 5
    examples: 8

loss_policy:
  source: multitask_tim4rec_optuna_v1 trial 110 / best_params.yaml
  ranking_weight: 1.0
  tuned_lambda_aux: 0.13182740780834337
  tuned_normalized_task_weights:
    is_click: 0.2555691799732421
    long_view: 0.23643110685667904
    is_like: 3.246987612489936
    is_profile_enter: 0.2610121006801428
  tuned_effective_pos_weights:
    is_click: 1.0573239205700589
    long_view: 1.286659439842131
    is_like: 9.092198541195886
    is_profile_enter: 7.598613882204391
  learning_rate: 0.0019075370668084298
  weight_decay: 1.925502656735127e-06
  head_lr_multiplier: 0.45851058258621097

test_safety:
  load_test_dataset: false
  create_test_dataloader: false
  evaluate_test: false
  test_evaluation_count: 0
