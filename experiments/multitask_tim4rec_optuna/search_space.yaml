parameters:
  lambda_aux:
    type: float
    low: 0.005
    high: 1.0
    log: true
  w_click_raw:
    type: float
    low: 0.1
    high: 10.0
    log: true
  w_long_view_raw:
    type: float
    low: 0.1
    high: 10.0
    log: true
  w_like_raw:
    type: float
    low: 0.1
    high: 10.0
    log: true
  w_profile_raw:
    type: float
    low: 0.1
    high: 10.0
    log: true
  alpha_common:
    type: float
    low: 0.0
    high: 1.0
    log: false
  alpha_rare:
    type: float
    low: 0.0
    high: 1.0
    log: false
  learning_rate:
    type: float
    low: 0.0001
    high: 0.003
    log: true
  weight_decay:
    type: float
    low: 0.0000001
    high: 0.01
    log: true
  dropout_prob:
    type: float
    low: 0.0
    high: 0.4
    log: false
  head_lr_multiplier:
    type: float
    low: 0.25
    high: 4.0
    log: true

normalization:
  task_weights: mean_equals_one
  common_tasks:
    - is_click
    - long_view
  rare_tasks:
    - is_like
    - is_profile_enter
  effective_pos_weight_formula: raw_pos_weight ** alpha_group
