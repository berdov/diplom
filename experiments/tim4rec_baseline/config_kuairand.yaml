# RecBole-конфиг KuaiRand Protocol B для воспроизведения TiM4Rec.
# Оригинальный upstream config сохранен без изменений:
# experiments/tim4rec_baseline/upstream/config/config4kuai_64d.yaml

gpu_id: '0'
use_gpu: True
log_wandb: False
reproducibility: True
seed: 2026
state: INFO
show_progress: False

data_path: /home/daryumin/iberdov/diplom/data/processed/protocol_b/recbole
checkpoint_dir: /home/daryumin/iberdov/diplom/experiments/tim4rec_baseline/checkpoints

# Настройки TiM4Rec.
hidden_size: 64
num_layers: 2
dropout_prob: 0.2
time_drop_out: 0.0
loss_type: 'CE'

d_state: 32
d_conv: 4
expand: 2
head_dim: 32
chunk_size: 32
norm_eps: 1e-10

is_ffn: True
# Осознанное решение: полная TiM4Rec в статье time-aware, а официальный
# config/config4kuai_64d.yaml сейчас содержит is_time: False. См. AUDIT.md.
is_time: True
p2p_residual: False
is_kai_ming_init: False

# Настройки датасета.
dataset: kuairand
MAX_ITEM_LIST_LENGTH: 50
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp
load_col:
  inter: [user_id, item_id, timestamp]

user_inter_num_interval: "[5,inf)"
item_inter_num_interval: "[5,inf)"
rm_dup_inter: ~

# Явные настройки RecBole sequential leave-one-out.
eval_args:
  split: {'LS': 'valid_and_test'}
  order: TO
  group_by: user
  mode: full

# Настройки обучения.
epochs: 300
train_batch_size: 2048
learner: adam
# Официальный KuaiRand config использует 0.001; статья указывает 0.01.
# Для первого запуска оставляем executable upstream value; mismatch описан в AUDIT.md.
learning_rate: 0.001
eval_step: 1
stopping_step: 10
train_neg_sample_args: ~
train_from_scratch: False
weight_decay: 0.0

# Настройки оценки. @5 добавлен для дипломных таблиц; статья публикует @10/@20/@50.
metrics: ['Hit', 'NDCG']
valid_metric: NDCG@10
eval_batch_size: 4096
topk: [5, 10, 20, 50]
metric_decimal_place: 4
