gpu_id: '0'
use_gpu: True
log_wandb: False
reproducibility: True
seed: 2026
state: INFO
show_progress: False

data_path: /home/daryumin/iberdov/diplom/data/processed/protocol_b_multitask/recbole
dataset: kuairand_multitask
checkpoint_dir: /home/daryumin/iberdov/diplom/experiments/multitask_tim4rec/checkpoints

# Same TiM4Rec backbone as experiments/tim4rec_baseline/config_kuairand.yaml.
hidden_size: 64
num_layers: 2
dropout_prob: 0.2
time_drop_out: 0.0
loss_type: 'CE'

d_state: 32
d_conv: 4
expand: 2
head_dim: 32
chunk_size: 32
norm_eps: 1e-10

is_ffn: True
is_time: True
p2p_residual: False
is_kai_ming_init: False

MAX_ITEM_LIST_LENGTH: 50
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp
load_col:
  inter:
    - user_id
    - item_id
    - timestamp
    - source_row_id
    - is_click
    - long_view
    - is_like
    - is_profile_enter

user_inter_num_interval: "[5,inf)"
item_inter_num_interval: "[5,inf)"
rm_dup_inter: ~

eval_args:
  split: {'LS': 'valid_and_test'}
  order: TO
  group_by: user
  mode: full

epochs: 5
train_batch_size: 2048
learner: adam
learning_rate: 0.001
eval_step: 1
stopping_step: 10
train_neg_sample_args: ~
train_from_scratch: False
weight_decay: 0.0

metrics: ['Hit', 'Recall', 'NDCG']
valid_metric: NDCG@10
eval_batch_size: 4096
topk: [5, 10, 20, 50]
metric_decimal_place: 4

multitask_targets:
  - is_click
  - long_view
  - is_like
  - is_profile_enter
lambda_aux: 0.2
use_pos_weight: True
test_evaluation_count: 0
