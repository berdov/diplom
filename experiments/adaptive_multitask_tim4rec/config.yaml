run_id: adaptive_smoke_001

base:
  model: MultitaskTiM4Rec
  backbone: TiM4Rec
  protocol: KuaiRand Protocol B multitask
  optuna_config: experiments/multitask_tim4rec_optuna/config.yaml
  best_params: experiments/multitask_tim4rec_optuna/best_params.yaml
  tuned_checkpoint: /home/daryumin/iberdov/diplom/experiments/multitask_tim4rec_optuna/multitask_tim4rec_tuned_001/checkpoints/best_validation.pth
  base_reference_run: tim4rec_001
  fixed_multitask_reference_run: multitask_tim4rec_001
  tuned_fixed_reference_run: multitask_tim4rec_tuned_001
  smoke_batches: 3
  diagnostic_shared_selector: all_backbone

targets:
  main: rank
  auxiliary:
    - is_click
    - long_view
    - is_like
    - is_profile_enter

loss_policy:
  ranking_weight: 1.0
  auxiliary_initialization: tuned_fixed_weights
  tuned_lambda_aux: 0.13182740780834337
  tuned_normalized_task_weights:
    is_click: 0.2555691799732421
    long_view: 0.23643110685667904
    is_like: 3.246987612489936
    is_profile_enter: 0.2610121006801428
  tuned_effective_pos_weights:
    is_click: 1.0573239205700589
    long_view: 1.286659439842131
    is_like: 9.092198541195886
    is_profile_enter: 7.598613882204391

gradnorm:
  enabled: true
  variant: auxiliary_only_rank_weight_fixed
  shared_selector: last_shared_block
  alpha: 1.5
  weight_learning_rate: 0.025
  renormalize_auxiliary_weights_sum_to: 4.0

pcgrad:
  enabled: true
  mode: ranking_anchored
  shared_selector: all_backbone
  seed: 2026

metabalance:
  enabled: true
  variant: MetaBalance-Fix
  shared_selector: all_backbone
  relax_factor: 0.7
  beta: 0.9
  source_code_reference:
    repository: https://github.com/facebookresearch/MetaBalance
    commit: 1c342a99e09ec3b465d95f46e0e1b5c4d86deb94
    license: Attribution-NonCommercial 4.0 International

test_safety:
  load_test_dataset: false
  create_test_dataloader: false
  evaluate_test: false
  test_evaluation_count: 0
